<!--
  ============================================================================
  Capte — Component Template ("component-name")
  ============================================================================

  WHAT THIS IS
  A self-contained custom code component engineered for Webflow Custom Code
  Embeds on capte.co. Includes semantic HTML markup, scoped CSS with design
  system variable fallbacks, and a self-executing vanilla JS lifecycle.

  HOW TO USE THIS TEMPLATE
  1. Duplicate this folder: `cp -r components/_template components/<my-component>`
  2. Rename classes from `.c-template` to `.c-<my-component>`
  3. Customize the HTML structure, CSS styling, and CONFIG object
  4. Paste the entire output into a Webflow Embed element
  ============================================================================
-->

<div class="c-template" id="c-template" data-component hidden>
  <button type="button" class="c-template_close" data-close aria-label="Close">
    <svg class="c-template_close-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
      <path d="M2 2L14 14M14 2L2 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="c-template_body">
    <p class="c-template_eyebrow" data-eyebrow></p>
    <h3 class="c-template_heading" data-heading></h3>
    <p class="c-template_description" data-description></p>
    <a class="c-template_cta" data-cta href="#">
      <span data-cta-label></span>
      <svg class="c-template_cta-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
        <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</div>

<style>
  /* ---------------------------------------------------------------------
     Component Tokens — Scoped to component with Design System Fallbacks
     --------------------------------------------------------------------- */
  .c-template {
    --c-primary:          var(--capte-primitive-primary-700, #001384);
    --c-accent:           var(--capte-primitive-secondary-500, #FC5522);
    --c-accent-hover:     var(--capte-primitive-secondary-600, #DD3603);
    --c-surface:          var(--capte-primitive-neutral-white, #FFFFFF);
    --c-surface-muted:    var(--capte-primitive-primary-50, #F2F4FC);
    --c-body:             var(--capte-primitive-neutral-950, #111523);
    --c-muted:            var(--capte-primitive-neutral-500, #7B8491);
    --c-border:           var(--capte-primitive-neutral-200, #D0D2D9);
    --c-focus-ring:       var(--capte-primitive-primary-500, #093AEC);

    --c-radius:           var(--capte-radius-lg, 0.75rem);   /* 12px */
    --c-space-2:          var(--capte-space-2, 0.5rem);      /* 8px */
    --c-space-4:          var(--capte-space-4, 1rem);        /* 16px */
    --c-space-6:          var(--capte-space-6, 1.5rem);      /* 24px */

    --c-shadow:           var(--capte-shadow-lg, 0 12px 32px rgba(0, 19, 132, 0.16));
    --c-z-index:          999;
  }

  /* Base Structure */
  .c-template {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: var(--c-space-4);
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--c-radius);
    box-shadow: var(--c-shadow);
    font-family: var(--capte-font-sans, "Roboto", Arial, sans-serif);
    color: var(--c-body);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.24s ease, transform 0.24s ease;
  }

  .c-template[hidden] { display: none; }

  .c-template.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .c-template {
      transition: none;
      transform: none;
    }
  }

  /* Close Button */
  .c-template_close {
    position: absolute;
    top: var(--c-space-2);
    right: var(--c-space-2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.75rem;
    height: 1.75rem;
    padding: 0;
    border: none;
    border-radius: 9999px;
    background: transparent;
    color: var(--c-muted);
    cursor: pointer;
  }

  .c-template_close:hover { background: var(--c-surface-muted); color: var(--c-primary); }
  .c-template_close:focus-visible {
    outline: 2px solid var(--c-focus-ring);
    outline-offset: 2px;
  }

  /* Body Content */
  .c-template_body {
    display: flex;
    flex-direction: column;
    gap: var(--c-space-2);
  }

  .c-template_eyebrow {
    margin: 0;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--c-accent);
  }
  .c-template_eyebrow:empty { display: none; }

  .c-template_heading {
    margin: 0;
    font-size: 1.125rem;
    font-weight: 700;
    line-height: 1.3;
    color: var(--c-primary);
  }

  .c-template_description {
    margin: 0;
    font-size: 0.875rem;
    line-height: 1.5;
    color: var(--c-body);
  }
  .c-template_description:empty { display: none; }

  /* Interactive CTA */
  .c-template_cta {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    margin-top: var(--c-space-2);
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--c-accent);
    text-decoration: none;
  }
  .c-template_cta:hover { color: var(--c-accent-hover); text-decoration: underline; }
  .c-template_cta:focus-visible {
    outline: 2px solid var(--c-focus-ring);
    outline-offset: 2px;
  }

  /* Responsive Adjustments */
  @media (max-width: 479px) {
    .c-template {
      padding: var(--c-space-2) var(--c-space-4);
    }
  }
</style>

<script>
(function () {
  "use strict";

  /* =========================================================================
     CONFIG — Update per deployment or campaign
     ========================================================================= */
  var CONFIG = {
    id: "template-instance-1",
    eyebrow: "Category",
    heading: "Component Title",
    description: "Descriptive copy highlighting key specs or features.",
    ctaLabel: "Learn More",
    href: "https://capte.co"
  };

  function applyContent(root, config) {
    var eyebrow = root.querySelector("[data-eyebrow]");
    if (eyebrow) eyebrow.textContent = config.eyebrow || "";

    var heading = root.querySelector("[data-heading]");
    if (heading) heading.textContent = config.heading || "";

    var desc = root.querySelector("[data-description]");
    if (desc) desc.textContent = config.description || "";

    var ctaLabel = root.querySelector("[data-cta-label]");
    if (ctaLabel) ctaLabel.textContent = config.ctaLabel || "Learn More";

    var cta = root.querySelector("[data-cta]");
    if (cta) cta.setAttribute("href", config.href || "#");

    root.setAttribute("role", "region");
    root.setAttribute("aria-label", config.heading || "Interactive Component");
  }

  function reveal(root) {
    root.hidden = false;
    requestAnimationFrame(function () {
      root.classList.add("is-visible");
    });
  }

  function init() {
    var root = document.getElementById("c-template");
    if (!root) return;

    applyContent(root, CONFIG);

    var closeBtn = root.querySelector("[data-close]");
    if (closeBtn) {
      closeBtn.addEventListener("click", function () {
        root.classList.remove("is-visible");
        root.hidden = true;
      });
    }

    reveal(root);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
